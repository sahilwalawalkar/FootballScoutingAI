[theme]
base = "dark"
primaryColor = "#22C77A"
backgroundColor = "#07120E"
secondaryBackgroundColor = "#0F211A"
textColor = "#EDF7F2"
linkColor = "#5EE2A1"
borderColor = "#234536"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "12px"
buttonRadius = "10px"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
chartCategoricalColors = ["#39D98A", "#60A5FA", "#F6C453", "#C084FC", "#FB7185", "#2DD4BF"]
greenColor = "#39D98A"
blueColor = "#60A5FA"
yellowColor = "#F6C453"
redColor = "#FB7185"

[theme.sidebar]
backgroundColor = "#091710"
secondaryBackgroundColor = "#12271E"
borderColor = "#234536"
textColor = "#E7F5EE"
primaryColor = "#39D98A"
